name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1. Node 22.19.0 ships npm
          # 10.9.3, which sends no credential and makes the registry answer
          # 404 on the scoped PUT.
          node-version-file: '.node-version'
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check # biome (incl. cognitive-complexity) + strict tsc

      - name: Publish package to npm
        run: npm publish --access public --provenance
